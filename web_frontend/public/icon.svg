<svg width="180" height="180" viewBox="0 0 180 180" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="180" height="180" rx="36" fill="url(#bg)"/>

  <!-- Route network lines -->
  <line x1="32" y1="90" x2="148" y2="90" stroke="url(#line)" stroke-width="3" stroke-linecap="round"/>
  <line x1="90" y1="32" x2="90" y2="148" stroke="url(#line)" stroke-width="3" stroke-linecap="round"/>
  <line x1="42" y1="42" x2="138" y2="138" stroke="url(#line)" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
  <line x1="138" y1="42" x2="42" y2="138" stroke="url(#line)" stroke-width="2" stroke-linecap="round" opacity="0.5"/>

  <!-- Hub nodes -->
  <circle cx="90" cy="90" r="14" fill="url(#hub)" />
  <circle cx="32" cy="90" r="7" fill="#06b6d4" opacity="0.9"/>
  <circle cx="148" cy="90" r="7" fill="#06b6d4" opacity="0.9"/>
  <circle cx="90" cy="32" r="7" fill="#06b6d4" opacity="0.9"/>
  <circle cx="90" cy="148" r="7" fill="#06b6d4" opacity="0.9"/>
  <circle cx="42" cy="42" r="5" fill="#818cf8" opacity="0.8"/>
  <circle cx="138" cy="42" r="5" fill="#818cf8" opacity="0.8"/>
  <circle cx="42" cy="138" r="5" fill="#818cf8" opacity="0.8"/>
  <circle cx="138" cy="138" r="5" fill="#818cf8" opacity="0.8"/>

  <!-- Truck icon in center hub -->
  <g transform="translate(80, 82)">
    <!-- Truck body -->
    <rect x="0" y="2" width="13" height="8" rx="1.5" fill="white"/>
    <!-- Cab -->
    <rect x="13" y="4" width="7" height="6" rx="1" fill="white"/>
    <!-- Windshield -->
    <rect x="14" y="5" width="4" height="3" rx="0.5" fill="#0e7490" opacity="0.8"/>
    <!-- Wheels -->
    <circle cx="4" cy="11" r="2" fill="#0e7490"/>
    <circle cx="16" cy="11" r="2" fill="#0e7490"/>
  </g>

  <!-- Pulse ring on center -->
  <circle cx="90" cy="90" r="22" stroke="#06b6d4" stroke-width="1.5" opacity="0.3"/>
  <circle cx="90" cy="90" r="30" stroke="#06b6d4" stroke-width="1" opacity="0.15"/>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="180" y2="180" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#0c1a2e"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="180" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.4"/>
      <stop offset="50%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.4"/>
    </linearGradient>
    <radialGradient id="hub" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0891b2"/>
      <stop offset="100%" stop-color="#0e7490"/>
    </radialGradient>
  </defs>
</svg>
